name: Release
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [chrome, firefox]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The tag is the version, so there is nothing to derive it from history.
      # A manual run falls back to whatever the manifest already says.
      - name: Work out the version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            printf 'version=%s\n' "${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            printf 'version=\n' >> "$GITHUB_OUTPUT"
          fi

      # Packaging verifies before it writes, so a release cannot be cut from a
      # build whose manifest points at files that are not there.
      - name: Package ${{ matrix.target }}
        run: |
          if [ -n "${{ steps.version.outputs.version }}" ]; then
            ./package.sh --target ${{ matrix.target }} --version "${{ steps.version.outputs.version }}"
          else
            ./package.sh --target ${{ matrix.target }}
          fi

      - name: Upload ${{ matrix.target }} package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-package
          path: dist/*.zip
          if-no-files-found: error

  publish-chrome:
    name: Publish to the Chrome Web Store
    runs-on: ubuntu-latest
    needs: package
    # Skipped until the store listing exists and EXTENSION_ID names it, so a tag
    # can never publish into somebody else's listing.
    if: vars.EXTENSION_ID != ''
    steps:
      - name: Download the chrome package
        uses: actions/download-artifact@v4
        with:
          name: chrome-package
          path: dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install the webstore cli
        run: npm install -g chrome-webstore-upload-cli

      # Docs for the api this uses:
      # https://developer.chrome.com/docs/webstore/using_webstore_api/
      - name: Upload
        env:
          EXTENSION_ID: ${{ vars.EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CI_GOOGLE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CI_GOOGLE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CI_GOOGLE_REFRESH_TOKEN }}
        run: |
          archive="$(ls dist/*.zip | head -1)"
          echo "uploading $archive"
          chrome-webstore-upload upload \
            --source "$archive" \
            --extension-id "$EXTENSION_ID" \
            --client-id "$CLIENT_ID" \
            --client-secret "$CLIENT_SECRET" \
            --refresh-token "$REFRESH_TOKEN"
